      <stop offset="50%" stop-color="#ff7d2e" />
      <stop offset="100%" stop-color="#ef5a33" />
    </linearGradient>

    
    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15" />
