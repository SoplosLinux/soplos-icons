    <rect x="7" y="34" width="114" height="8" rx="4" fill="#000000" fill-opacity="0.14" />

    
    <rect x="6" y="36" width="116" height="82" rx="11" ry="11" fill="url(#whiteFrontGrad)" stroke="#B5BBC4" stroke-width="1.2" />

    
    <path d="M 17 36.8 L 111 36.8 C 116.5 36.8 121 41.2 121 46.8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

    
    <ellipse cx="99" cy="51" rx="9" ry="4" fill="#C7CDD6" fill-opacity="0.55" />

    
    
    <rect x="45" y="98.5" width="38" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.8" />
    
