<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="outerShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    
    <linearGradient id="greyBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8AEB6" />
      <stop offset="60%" stop-color="#8A9098" />
      <stop offset="100%" stop-color="#6C727A" />
    </linearGradient>

    
    <linearGradient id="orangeLayerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC600" />
      <stop offset="45%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#EE7A00" />
    </linearGradient>

    
    <linearGradient id="whiteFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA" />
      <stop offset="75%" stop-color="#E6E9EE" />
      <stop offset="100%" stop-color="#CFD4DC" />
    </linearGradient>

    
    <linearGradient id="slotInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F757D" />
      <stop offset="100%" stop-color="#8B919A" />
